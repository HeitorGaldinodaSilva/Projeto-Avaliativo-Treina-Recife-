<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaginaLogin</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/bootstrap.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

    <div id="imagemFundo">
        <div class="login">
            <div class="loginBox">
                <div class="conteudoLogin">

                    <div class="loginLogo">
                        <img src="/img/logo_1.png">
                    </div>

                    <div class="loginEmail">
                        <label for="Email" class="form-label">Email</label>
                        <input type="text" class="EmailLogin" id="Email" placeholder="E-mail">
                        <label class="textoLogin">Nunca compartilhe suas credenciais.</label>
                    </div>

                    <div class="loginSenha">
                        <label for="Senha" class="form-label">Senha</label>
                        <div class="campoSenhaWrapper">
                            <input type="password" class="senhaLogin" id="Senha" placeholder="Senha">
                            <button type="button" class="btnMostrarSenha" id="btnMostrarSenha">Mostrar</button>
                        </div>
                    </div>

                    <div class="loginCheckbox">
                        <input type="checkbox" id="manterConectado" checked>
                        <label for="manterConectado">Mantenha-me conectado</label>
                    </div>

                    <button type="button" class="btnEntrar" id="btnEntrar">Entrar</button>

                </div>
            </div>
        </div>
    </div>

    <script src="/js/script.js"></script>
</body>
</html>
